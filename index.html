<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Downloader Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8b5cf6;
            --success: #10b981;
            --glass: rgba(15, 23, 42, 0.85);
            --border: rgba(255, 255, 255, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: #000;
            color: white;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 0; 
            overflow-y: auto; 
        }

        /* --- الخلفية المجرية --- */
        .galaxy-bg {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2;
            background: radial-gradient(ellipse at bottom, #1B2735 0%, #090A0F 100%);
            overflow: hidden;
        }
        .stars { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: radial-gradient(2px 2px at 20px 30px, #fff, rgba(0,0,0,0)), radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)); background-repeat: repeat; background-size: 200px 200px; animation: moveStars 100s linear infinite; }
        @keyframes moveStars { from { transform: translateY(0); } to { transform: translateY(-2000px); } }
        
        /* --- واجهة التطبيق (تم تكبيرها) --- */
        .app-container {
            width: 95%; max-width: 600px; /* كبرنا العرض */
            background: var(--glass);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border); border-radius: 25px; padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; gap: 20px; z-index: 10; margin-bottom: 50px;
        }

        /* اللوجو */
        .logo-container { display: flex; justify-content: center; margin-bottom: 5px; }
        .logo-box {
            width: 80px; height: 80px; /* كبرنا اللوجو */
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid var(--border);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .logo-box img { width: 100%; height: 100%; object-fit: cover; }

        .header { text-align: center; }
        .header h1 { font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 0 15px rgba(139, 92, 246, 0.6); }
        .header p { font-size: 14px; color: #94a3b8; margin-top: 5px; }

        .tabs { display: flex; background: rgba(0,0,0,0.5); padding: 6px; border-radius: 15px; gap: 6px; border: 1px solid var(--border); }
        .tab { flex: 1; padding: 10px 4px; text-align: center; border-radius: 10px; cursor: pointer; font-weight: 600; font-size: 13px; color: #94a3b8; transition: 0.3s; }
        .tab i { display: block; font-size: 18px; margin-bottom: 5px; }
        .tab.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4); }

        .input-area { display: flex; gap: 10px; }
        input[type="text"] {
            flex: 1; padding: 15px; border-radius: 12px; border: 1px solid var(--border);
            background: rgba(0,0,0,0.5); color: white; font-family: inherit; font-size: 15px; outline: none; transition: 0.3s;
        }
        input[type="text"]:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(139, 92, 246, 0.3); }
        
        .btn-main {
            padding: 0 25px; border-radius: 12px; border: none; background: var(--primary); color: white;
            font-weight: bold; font-family: inherit; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; min-width: 80px; font-size: 16px;
        }
        .btn-main:hover { background: #7c3aed; transform: scale(1.05); }

        .results-list { display: flex; flex-direction: column; gap: 12px; padding-left: 5px; }
        .song-item {
            display: flex; align-items: center; gap: 15px; background: rgba(255,255,255,0.05);
            padding: 10px; border-radius: 15px; border: 1px solid transparent; transition: 0.3s; cursor: pointer;
        }
        .song-item:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); transform: translateX(-5px); }
        .song-item img { width: 70px; height: 70px; border-radius: 10px; object-fit: cover; background: #1e293b; }
        .song-info { flex: 1; overflow: hidden; }
        .song-title { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .song-duration { font-size: 12px; color: #94a3b8; margin-top: 5px; }

        /* --- المودال --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9);
            backdrop-filter: blur(5px); z-index: 100; display: none; justify-content: center; align-items: center;
            opacity: 0; transition: opacity 0.3s; padding: 15px;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: #111827; width: 100%; max-width: 450px; border-radius: 20px;
            border: 1px solid var(--border); overflow: hidden; transform: scale(0.9); transition: 0.3s;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8); position: relative; max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        
        .media-container { width: 100%; height: 250px; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
        .media-container img { width: 100%; height: 100%; object-fit: contain; }
        .media-container iframe { width: 100%; height: 100%; display: none; border: none; }
        .media-container video { width: 100%; height: 100%; display: none; object-fit: contain; }
        
        .loader-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; font-size: 16px; color: var(--primary); flex-direction: column; gap: 10px; z-index: 5; }

        .play-overlay { position: absolute; font-size: 60px; color: rgba(255,255,255,0.8); cursor: pointer; transition: 0.3s; text-shadow: 0 0 20px rgba(0,0,0,0.8); z-index: 5; }
        .play-overlay:hover { color: var(--primary); transform: scale(1.1); }

        .modal-body { padding: 20px; }
        .modal-title { font-size: 16px; margin-bottom: 10px; line-height: 1.4; }
        
        .modal-buttons { display: flex; gap: 10px; margin-top: 15px; }
        .btn-action { flex: 1; padding: 14px; border-radius: 12px; border: none; color: white; font-weight: bold; font-family: inherit; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
        .btn-audio { background: var(--success); }
        .btn-video { background: #3b82f6; }
        .btn-close { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.7); border: 1px solid #fff; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10; }
        
        .upload-zone {
            border: 2px dashed var(--primary); border-radius: 15px; padding: 35px 20px; text-align: center;
            cursor: pointer; background: rgba(139, 92, 246, 0.05); transition: 0.3s; margin-top: 10px;
        }
        .upload-zone:hover { background: rgba(139, 92, 246, 0.15); }
        .upload-zone i { font-size: 45px; color: var(--primary); margin-bottom: 15px; }
        input[type="file"] { display: none; }
        
        .rec-result { display: none; margin-top: 20px; background: rgba(16, 185, 129, 0.1); border: 1px solid var(--success); padding: 20px; border-radius: 15px; align-items: center; gap: 15px; flex-wrap: wrap; }
        .rec-result img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
        .rec-info { flex: 1; min-width: 150px; }
        
        .hidden { display: none !important; }
        .spinner { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="galaxy-bg"><div class="stars"></div></div>

    <div class="app-container">
        <div class="logo-container">
            <div class="logo-box">
                <!-- اللوجو -->
                <img src="logo.png" alt="Logo" onerror="this.src='https://cdn-icons-png.flaticon.com/512/727/727245.png'; this.style.filter='invert(1)';">
            </div>
        </div>

        <div class="header">
            <h1>Galaxy Downloader</h1>
            <p>تحميل، مشاهدة، تحويل، وتعرف على الأغاني</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('search')" id="tabSearch"><i class="fa-solid fa-magnifying-glass"></i> بحث</div>
            <div class="tab" onclick="switchTab('url')" id="tabUrl"><i class="fa-solid fa-link"></i> رابط</div>
            <div class="tab" onclick="switchTab('local')" id="tabLocal"><i class="fa-solid fa-mobile-screen"></i> تحويل</div>
            <div class="tab" onclick="switchTab('recognize')" id="tabRecognize"><i class="fa-solid fa-microphone"></i> تعرف</div>
        </div>

        <div id="searchSection">
            <div class="input-area">
                <input type="text" id="searchInput" placeholder="ابحث عن أغنية أو فيديو..." onkeypress="handleKeyPress(event)">
                <button class="btn-main" onclick="search()" id="searchBtn">بحث</button>
            </div>
            <div class="results-list" id="searchResults" style="margin-top: 20px;"></div>
        </div>

        <div id="urlSection" class="hidden">
            <div class="input-area">
                <input type="text" id="urlInput" placeholder="الصق رابط (يوتيوب، تيك توك، بنترست...)">
                <button class="btn-main" onclick="fetchUrlInfo()" id="urlBtn">جلب</button>
            </div>
        </div>

        <div id="localSection" class="hidden">
            <div class="upload-zone" onclick="document.getElementById('convFileInput').click()">
                <i class="fa-solid fa-file-video"></i>
                <p style="font-weight:600; font-size: 18px;">اختر فيديو من جهازك</p>
                <span style="font-size:14px; color:#94a3b8;">سيتم تحويله لملف صوتي MP3</span>
            </div>
            <input type="file" id="convFileInput" accept="video/*" onchange="uploadVideo()">
            <div id="convStatus" style="text-align:center; font-weight:bold; color:var(--success); margin-top:15px;"></div>
        </div>

        <div id="recognizeSection" class="hidden">
            <div class="upload-zone" onclick="document.getElementById('recFileInput').click()">
                <i class="fa-solid fa-music"></i>
                <p style="font-weight:600; font-size: 18px;">ارفع مقطع صوتي أو فيديو</p>
                <span style="font-size:14px; color:#94a3b8;">عشان نعرفلك اسم الأغنية</span>
            </div>
            <input type="file" id="recFileInput" accept="audio/*,video/*" onchange="recognizeAudio()">
            
            <div id="recStatus" style="text-align:center; font-weight:bold; color:var(--primary); margin-top:15px;"></div>
            
            <div class="rec-result" id="recResultBox">
                <img id="recImage" src="" alt="cover">
                <div class="rec-info">
                    <p style="margin:0 0 5px 0; font-size:16px; font-weight:bold; color:#fff;" id="recTitle"></p>
                    <p style="margin:0; font-size:14px; color:#a7f3d0;" id="recArtist"></p>
                </div>
                <button class="btn-action btn-audio" style="flex: unset; width: 100%; margin-top: 15px;" onclick="downloadRecognized()"><i class="fa-solid fa-download"></i> تحميل الأغنية الآن</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="previewModal">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-times"></i></button>
            
            <div class="media-container" id="mediaContainer">
                <img src="" id="modalImage">
                <iframe id="modalIframe" allow="autoplay; encrypted-media" allowfullscreen></iframe>
                <video controls id="modalVideo" src=""></video>
                
                <div class="loader-overlay" id="videoLoader">
                    <i class="fa-solid fa-spinner spinner" style="font-size: 30px;"></i> جاري تحضير الفيديو...
                </div>
                
                <i class="fa-solid fa-circle-play play-overlay" id="playIcon" onclick="playVideo()"></i>
            </div>

            <div class="modal-body">
                <h3 class="modal-title" id="modalTitle"></h3>
                <p style="font-size:14px; color:#94a3b8;"><i class="fa-regular fa-clock"></i> <span id="modalDuration"></span></p>
                
                <div class="modal-buttons">
                    <button class="btn-action btn-audio" onclick="startDownload('audio', this)"><i class="fa-solid fa-music"></i> صوت MP3</button>
                    <button class="btn-action btn-video" onclick="startDownload('video', this)"><i class="fa-solid fa-video"></i> فيديو MP4</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentTargetUrl = '';
        let recognizedSongName = '';
        let previewDirectUrl = '';

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            ['search', 'url', 'local', 'recognize'].forEach(sec => {
                document.getElementById(sec + 'Section').classList.add('hidden');
            });
            document.getElementById(tab + 'Section').classList.remove('hidden');
            document.getElementById('convStatus').innerText = '';
            document.getElementById('recStatus').innerText = '';
        }

        async function search() {
            const query = document.getElementById('searchInput').value;
            if (!query) return;
            const btn = document.getElementById('searchBtn');
            const resultsDiv = document.getElementById('searchResults');
            btn.innerHTML = '<i class="fa-solid fa-spinner spinner"></i>'; resultsDiv.innerHTML = '';

            try {
                const res = await fetch(`/search?q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if(data.error) throw new Error();
                
                data.forEach(song => {
                    const div = document.createElement('div');
                    div.className = 'song-item';
                    const fallbackImg = 'https://via.placeholder.com/70/1e293b/ffffff?text=🎵';
                    div.innerHTML = `
                        <img src="${song.thumbnail}" onerror="this.src='${fallbackImg}'">
                        <div class="song-info">
                            <p class="song-title">${song.title}</p>
                            <p class="song-duration"><i class="fa-regular fa-clock"></i> ${song.duration}</p>
                        </div>
                    `;
                    div.onclick = () => openModal(song.title, song.duration, song.thumbnail, song.url, false);
                    resultsDiv.appendChild(div);
                });
            } catch (e) { resultsDiv.innerHTML = '<p style="text-align:center; color:#ef4444;">خطأ في البحث</p>'; }
            btn.innerText = 'بحث';
        }

        function handleKeyPress(e) { if (e.key === 'Enter') search(); }

        async function fetchUrlInfo() {
            const url = document.getElementById('urlInput').value;
            if (!url) return alert('ضع الرابط أولاً');
            const btn = document.getElementById('urlBtn');
            btn.innerHTML = '<i class="fa-solid fa-spinner spinner"></i>';

            try {
                const res = await fetch(`/info?url=${encodeURIComponent(url)}`);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                openModal(data.title, data.duration, data.thumbnail, data.url, data.preview_url);
            } catch (e) { alert('الرابط غير مدعوم أو حدث خطأ في جلب البيانات'); }
            btn.innerText = 'جلب';
        }

        function openModal(title, duration, thumb, originalUrl, directVideoUrl = null) {
            currentTargetUrl = originalUrl;
            previewDirectUrl = directVideoUrl;
            
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDuration').innerText = duration;
            
            const img = document.getElementById('modalImage');
            const iframe = document.getElementById('modalIframe');
            const vid = document.getElementById('modalVideo');
            const playIcon = document.getElementById('playIcon');
            const loader = document.getElementById('videoLoader');

            img.src = thumb || 'https://via.placeholder.com/400x200/1e293b/ffffff?text=Preview';
            img.style.display = 'block';
            iframe.style.display = 'none'; iframe.src = '';
            vid.style.display = 'none'; vid.src = '';
            playIcon.style.display = 'block';
            loader.style.display = 'none';
            
            const modal = document.getElementById('previewModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function getYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // دالة التشغيل المطورة (بتتعامل مع يوتيوب وباقي المواقع)
        function playVideo() {
            const img = document.getElementById('modalImage');
            const iframe = document.getElementById('modalIframe');
            const vid = document.getElementById('modalVideo');
            const playIcon = document.getElementById('playIcon');
            
            img.style.display = 'none';
            playIcon.style.display = 'none';

            const ytId = getYouTubeID(currentTargetUrl);
            
            if (ytId) {
                // لو يوتيوب نشغل iframe
                iframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1`;
                iframe.style.display = 'block';
            } else if (previewDirectUrl) {
                // لو مش يوتيوب وفيه لينك مباشر (تيك توك/بنترست)، نشغل الـ video
                vid.src = previewDirectUrl;
                vid.style.display = 'block';
                vid.play().catch(e => {
                    // لو المتصفح رفض التشغيل المباشر
                    img.style.display = 'block';
                    playIcon.style.display = 'block';
                    alert("المتصفح منع التشغيل المباشر لهذا الموقع. تقدر تنزله وتتفرج عليه.");
                });
            } else {
                alert("المعاينة المباشرة مش متاحة للموقع ده. تقدر تنزله وتتفرج عليه.");
                img.style.display = 'block';
                playIcon.style.display = 'block';
            }
        }

        function closeModal() {
            const modal = document.getElementById('previewModal');
            const iframe = document.getElementById('modalIframe');
            const vid = document.getElementById('modalVideo');
            iframe.src = ''; vid.pause();
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
        }

        function startDownload(type, btnElement) {
            if(!currentTargetUrl) return;
            const originalText = btnElement.innerHTML;
            btnElement.innerHTML = '<i class="fa-solid fa-spinner spinner"></i>';
            window.location.href = `/download?url=${encodeURIComponent(currentTargetUrl)}&type=${type}`;
            setTimeout(() => { btnElement.innerHTML = originalText; }, 4000);
        }

        async function recognizeAudio() {
            const fileInput = document.getElementById('recFileInput');
            const status = document.getElementById('recStatus');
            const resultBox = document.getElementById('recResultBox');
            if (!fileInput.files.length) return;

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('media', file);

            status.innerHTML = '<i class="fa-solid fa-spinner spinner"></i> جاري الاستماع للأغنية...';
            resultBox.style.display = 'none';

            try {
                const response = await fetch('/recognize', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.found) {
                    status.innerHTML = '<i class="fa-solid fa-check-circle" style="color:#10b981;"></i> لقيتها!';
                    document.getElementById('recTitle').innerText = data.title;
                    document.getElementById('recArtist').innerText = data.artist;
                    document.getElementById('recImage').src = data.image || 'https://via.placeholder.com/70?text=🎵';
                    resultBox.style.display = 'flex';
                    recognizedSongName = `${data.artist} - ${data.title}`;
                } else {
                    status.innerHTML = `<i class="fa-solid fa-times-circle" style="color:#ef4444;"></i> ${data.message || 'مقدرتش أتعرف عليها'}`;
                }
            } catch (error) {
                status.innerHTML = '<i class="fa-solid fa-times-circle" style="color:#ef4444;"></i> حدث خطأ في الاتصال.';
            }
            fileInput.value = ''; 
        }

        function downloadRecognized() {
            if(!recognizedSongName) return;
            window.location.href = `/download_search?q=${encodeURIComponent(recognizedSongName)}&type=audio`;
        }

        async function uploadVideo() {
            const fileInput = document.getElementById('convFileInput');
            const status = document.getElementById('convStatus');
            if (!fileInput.files.length) return;

            const file = fileInput.files[0];
            const formData = new FormData();
            formData.append('video', file);

            status.innerHTML = '<i class="fa-solid fa-spinner spinner"></i> جاري التحويل...';

            try {
                const response = await fetch('/convert', { method: 'POST', body: formData });
                if (!response.ok) throw new Error();

                const blob = await response.blob();
                const downloadUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = downloadUrl;
                a.download = file.name.split('.')[0] + '.mp3';
                document.body.appendChild(a);
                a.click();
                a.remove();
                
                status.innerHTML = '<i class="fa-solid fa-check-circle"></i> تم التحميل بنجاح!';
                fileInput.value = '';
            } catch (error) {
                status.innerHTML = '<i class="fa-solid fa-times-circle" style="color:#ef4444;"></i> فشل التحويل';
            }
        }
    </script>
</body>
</html>
